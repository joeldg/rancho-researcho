[project]
name = "rancho-researcho"
version = "0.1.0"
description = "A self-hosted, evidence-first web research service."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "greenlet>=3,<4",
  "httpx>=0.27,<1",
  "markdownify>=0.13,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.20,<1",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rancho"]
